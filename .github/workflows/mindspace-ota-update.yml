name: Mindspace OTA Update

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      message:
        description: 'Update message'
        required: false
        default: 'Manual OTA update'

concurrency:
  group: ota-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-update:
    name: Test & Publish OTA Update
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update to preview channel
        run: |
          eas update \
            --channel preview \
            --message "${{ github.event.inputs.message || github.event.head_commit.message }}" \
            --non-interactive

